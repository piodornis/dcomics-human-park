">Schematische Einheiten, keine Realmaße. Tiefe, Drehfreiraum und Faltung sind noch zu konstruieren.</text><text x="60" y="873" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#203b45">Die Rückansichten zeigen denselben schmalen Korpus. Keine ausfahrbaren oder mitdrehenden Schultern.</text></svg>